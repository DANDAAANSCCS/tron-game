<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DEFENSE — LOGIN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="scanlines"></div>

  <div class="login-container">
    <div class="login-logo">
      <h1 class="logo" style="font-size:2.2rem;letter-spacing:12px;">
        <span class="logo-bracket">[</span>
        NEON DEFENSE
        <span class="logo-bracket">]</span>
      </h1>
      <div class="logo-subtitle">AUTHENTICATION REQUIRED</div>
    </div>

    <!-- Tab switcher -->
    <div class="login-tabs">
      <button class="login-tab active" data-tab="login">LOGIN</button>
      <button class="login-tab" data-tab="register">REGISTER</button>
    </div>

    <!-- Login form -->
    <form class="login-form active" id="login-form" data-tab="login">
      <div class="form-group">
        <label class="form-label">USERNAME</label>
        <input type="text" class="form-input" id="login-user" autocomplete="username" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <input type="password" class="form-input" id="login-pass" autocomplete="current-password" placeholder="Enter password">
      </div>
      <div class="form-error" id="login-error"></div>
      <button type="submit" class="form-btn">ACCESS GRID</button>
    </form>

    <!-- Register form -->
    <form class="login-form" id="register-form" data-tab="register">
      <div class="form-group">
        <label class="form-label">USERNAME</label>
        <input type="text" class="form-input" id="reg-user" autocomplete="username" placeholder="Choose username (min 3)">
      </div>
      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <input type="password" class="form-input" id="reg-pass" autocomplete="new-password" placeholder="Choose password (min 4)">
      </div>
      <div class="form-group">
        <label class="form-label">CONFIRM PASSWORD</label>
        <input type="password" class="form-input" id="reg-pass2" autocomplete="new-password" placeholder="Confirm password">
      </div>
      <div class="form-error" id="register-error"></div>
      <button type="submit" class="form-btn">CREATE ACCOUNT</button>
    </form>

    <!-- Google login (shown only if configured) -->
    <div class="login-divider" id="google-section" style="display:none;">
      <div class="divider-line"></div>
      <span class="divider-text">OR</span>
      <div class="divider-line"></div>
    </div>
    <a href="/auth/google" class="google-btn" id="google-btn" style="display:none;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span>GOOGLE LOGIN</span>
    </a>

    <div class="login-footer">
      <span class="version">v1.0</span>
      <span class="separator">|</span>
      <span class="status">GRID AUTHENTICATION</span>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
