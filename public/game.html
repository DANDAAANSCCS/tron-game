<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DEFENSE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050508;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', monospace;
    }

    canvas { display: block; }

    #hud {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .hud-section {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .hud-item {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: rgba(0, 255, 242, 0.6);
      text-shadow: 0 0 8px rgba(0, 255, 242, 0.3);
    }

    .hud-item .val { color: #00fff2; font-weight: 700; }
    .hud-item .val-hp { color: #00ff66; }
    .hud-item .val-wave { color: #ff6600; }
    .hud-item .val-score { color: #ffdd00; }

    .hud-center {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: rgba(0, 255, 242, 0.85);
      text-shadow: 0 0 12px rgba(0, 255, 242, 0.5);
      letter-spacing: 4px;
    }

    /* Ability bar */
    #ability-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }

    .ability-slot {
      width: 60px; height: 60px;
      border: 2px solid rgba(0, 255, 242, 0.3);
      background: rgba(5, 5, 15, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-family: 'Share Tech Mono', monospace;
    }

    .ability-slot .ability-icon {
      font-size: 1.4rem;
      color: #00fff2;
      text-shadow: 0 0 10px #00fff2;
    }

    .ability-slot .ability-key {
      font-size: 0.55rem;
      color: rgba(0, 255, 242, 0.5);
      position: absolute;
      bottom: 2px;
      letter-spacing: 1px;
    }

    .ability-slot .ability-cooldown {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: rgba(255, 102, 0, 0.8);
    }

    .ability-slot.ready {
      border-color: rgba(0, 255, 242, 0.7);
      box-shadow: 0 0 15px rgba(0, 255, 242, 0.2);
    }

    /* Overlay */
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    #overlay.hidden { display: none; }

    #overlay-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      font-weight: 900;
      color: #00fff2;
      text-shadow: 0 0 20px #00fff2, 0 0 60px #00fff2;
      letter-spacing: 8px;
    }

    #overlay-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      color: rgba(0, 255, 242, 0.5);
      letter-spacing: 4px;
      margin-top: 15px;
    }

    /* Minimap */
    #minimap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      border: 1px solid rgba(0, 255, 242, 0.2);
      z-index: 10;
      background: rgba(5, 5, 8, 0.7);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="minimap" width="180" height="180"></canvas>

  <div id="hud">
    <div class="hud-section">
      <div class="hud-item">HP: <span class="val val-hp" id="hp-val">100</span></div>
      <div class="hud-item">KILLS: <span class="val val-score" id="kills-val">0</span></div>
      <div class="hud-item hud-gold">&nbsp;&nbsp;&nbsp;<span class="val" id="gold-val" style="color:#ffd700">0</span></div>
      <div class="hud-item hud-gem">&nbsp;&nbsp;&nbsp;<span class="val" id="gems-val" style="color:#e040fb">0</span></div>
    </div>
    <div class="hud-center"><span style="font-size:0.7rem;opacity:0.6;">LVL <span id="level-val">1</span></span> WAVE <span id="wave-val">1</span><span style="font-size:0.65rem;opacity:0.5;"> / 100</span></div>
    <div class="hud-section">
      <div class="hud-item">MODE: <span class="val" id="mode-val">AUTO</span></div>
      <div class="hud-item">ENEMIES: <span class="val val-wave" id="enemies-val">0</span></div>
      <div class="hud-item">SCORE: <span class="val val-score" id="score-val">0</span></div>
    </div>
  </div>

  <div id="ability-bar">
    <div class="ability-slot ready" id="ability-emp">
      <span class="ability-icon">&#x26A1;</span>
      <span class="ability-key">SPACE</span>
    </div>
  </div>

  <div id="overlay">
    <div id="overlay-text">WAVE 1</div>
    <div id="overlay-sub"></div>
  </div>

  <script src="auth-check.js"></script>
  <script src="game.js"></script>
</body>
</html>
