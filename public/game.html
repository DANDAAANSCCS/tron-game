<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRON - Light Cycles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050508;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', monospace;
    }

    canvas {
      display: block;
      cursor: none;
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .hud-left, .hud-right, .hud-center {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: rgba(0, 255, 242, 0.6);
      text-shadow: 0 0 8px rgba(0, 255, 242, 0.3);
    }

    .hud-center {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: rgba(0, 255, 242, 0.8);
    }

    #speed-val { color: #00fff2; }
    #alive-val { color: #ff6600; }

    /* Countdown & Messages */
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    #overlay.hidden { display: none; }

    #overlay-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 5rem;
      font-weight: 900;
      color: #00fff2;
      text-shadow: 0 0 20px #00fff2, 0 0 60px #00fff2;
      letter-spacing: 10px;
    }

    #overlay-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      color: rgba(0, 255, 242, 0.5);
      letter-spacing: 5px;
      margin-top: 20px;
    }

    /* Minimap */
    #minimap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      border: 1px solid rgba(0, 255, 242, 0.2);
      z-index: 10;
      background: rgba(5, 5, 8, 0.7);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="minimap" width="180" height="180"></canvas>

  <div id="hud">
    <div class="hud-left">SPEED: <span id="speed-val">0</span></div>
    <div class="hud-center">ROUND <span id="round-val">1</span></div>
    <div class="hud-right">ALIVE: <span id="alive-val">0</span></div>
  </div>

  <div id="overlay">
    <div id="overlay-text">3</div>
    <div id="overlay-sub"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
