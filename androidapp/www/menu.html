<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/app-config.js"></script>
  <script src="shared/offline.js"></script>
  <script src="shared/i18n.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DEFENSE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="scanlines"></div>

  <div class="menu-container">
    <div class="logo-container">
      <h1 class="logo">
        <span class="logo-bracket">[</span>
        NEON DEFENSE
        <span class="logo-bracket">]</span>
      </h1>
      <div class="logo-subtitle" data-i18n="menu.subtitle">DEFENSE GRID ONLINE</div>
    </div>

    <nav class="menu">
      <a href="#" class="menu-item active" data-index="0">
        <span class="menu-arrow">&gt;</span>
        <span class="menu-text" data-i18n="menu.play">INICIAR JUEGO</span>
        <span class="menu-line"></span>
      </a>
      <a href="#" class="menu-item" data-index="1">
        <span class="menu-arrow">&gt;</span>
        <span class="menu-text" data-i18n="menu.upgrades">MEJORAS</span>
        <span class="menu-line"></span>
      </a>
      <a href="#" class="menu-item" data-index="2">
        <span class="menu-arrow">&gt;</span>
        <span class="menu-text" data-i18n="menu.abilities">HABILIDADES</span>
        <span class="menu-line"></span>
      </a>
      <a href="#" class="menu-item" data-index="3">
        <span class="menu-arrow">&gt;</span>
        <span class="menu-text" data-i18n="menu.shop">TIENDA</span>
        <span class="menu-line"></span>
      </a>
      <a href="#" class="menu-item" data-index="4">
        <span class="menu-arrow">&gt;</span>
        <span class="menu-text" data-i18n="menu.controls">CONTROLES</span>
        <span class="menu-line"></span>
      </a>
      <a href="#" class="menu-item" data-index="5">
        <span class="menu-arrow">&gt;</span>
        <span class="menu-text" data-i18n="menu.ranking">RANKING</span>
        <span class="menu-line"></span>
      </a>
    </nav>

    <div class="menu-currencies" id="menu-currencies" style="display:none;">
      <div class="menu-currency"><span class="mc-icon" style="color:#e040fb;">&#9670;</span><span class="mc-label">GEMS</span><span class="mc-val" id="menu-gems" style="color:#e040fb;">0</span></div>
      <div class="menu-currency"><span class="mc-icon" style="color:#c0c0c0;">&#9673;</span><span class="mc-label">SILVER</span><span class="mc-val" id="menu-silver" style="color:#c0c0c0;">0</span></div>
    </div>

    <div class="footer-info">
      <span class="version">v1.0</span>
      <span class="separator">|</span>
      <span class="status" data-i18n="menu.connected">CONNECTED TO GRID</span>
    </div>
  </div>

  <div class="user-bar" id="user-bar" style="display:none;">
    <span class="user-name" id="user-display"></span>
    <button class="logout-btn" id="logout-btn" data-i18n="menu.logout">[LOGOUT]</button>
  </div>

  <!-- Settings overlay for menu -->
  <div id="menu-settings-btn" style="position:fixed;bottom:20px;right:20px;width:44px;height:44px;border:1px solid rgba(0,255,242,0.3);background:rgba(5,5,15,0.8);display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:rgba(0,255,242,0.7);cursor:pointer;z-index:50;-webkit-tap-highlight-color:transparent;">&#9881;</div>
  <div id="menu-settings-panel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:220px;background:rgba(5,5,18,0.96);border:1px solid rgba(0,255,242,0.45);box-shadow:0 0 30px rgba(0,255,242,0.15);padding:20px 18px 16px;z-index:60;font-family:'Orbitron',sans-serif;">
    <div style="font-size:0.75rem;font-weight:700;color:rgba(0,255,242,0.9);text-shadow:0 0 10px rgba(0,255,242,0.5);letter-spacing:4px;text-align:center;margin-bottom:16px;border-bottom:1px solid rgba(0,255,242,0.15);padding-bottom:10px;">CONFIG</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:rgba(0,255,242,0.6);letter-spacing:2px;">
      <span data-i18n="settings.music">MUSICA</span>
      <button id="menu-music-toggle" style="background:rgba(0,255,242,0.12);border:1px solid rgba(0,255,242,0.4);color:#00fff2;font-family:'Orbitron',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:2px;padding:5px 12px;cursor:pointer;">ON</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;margin-top:-4px;">
      <button id="menu-track-prev" style="background:rgba(0,255,242,0.08);border:1px solid rgba(0,255,242,0.3);color:rgba(0,255,242,0.7);font-family:'Orbitron',sans-serif;font-size:0.7rem;font-weight:700;width:28px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;">&lt;</button>
      <span id="menu-track-name" style="font-family:'Share Tech Mono',monospace;font-size:0.55rem;color:rgba(0,255,242,0.5);letter-spacing:1px;min-width:90px;text-align:center;">TRACK</span>
      <button id="menu-track-next" style="background:rgba(0,255,242,0.08);border:1px solid rgba(0,255,242,0.3);color:rgba(0,255,242,0.7);font-family:'Orbitron',sans-serif;font-size:0.7rem;font-weight:700;width:28px;height:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;">&gt;</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:rgba(0,255,242,0.6);letter-spacing:2px;">
      <span data-i18n="settings.sfx">EFECTOS</span>
      <button id="menu-sfx-toggle" style="background:rgba(0,255,242,0.12);border:1px solid rgba(0,255,242,0.4);color:#00fff2;font-family:'Orbitron',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:2px;padding:5px 12px;cursor:pointer;">ON</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:rgba(0,255,242,0.6);letter-spacing:2px;">
      <span data-i18n="settings.language">IDIOMA</span>
      <button id="menu-lang-toggle" style="background:rgba(0,255,242,0.12);border:1px solid rgba(0,255,242,0.4);color:#00fff2;font-family:'Orbitron',sans-serif;font-size:0.6rem;font-weight:700;letter-spacing:2px;padding:5px 12px;cursor:pointer;">ES</button>
    </div>
    <button id="menu-settings-close" style="display:block;width:100%;background:transparent;border:1px solid rgba(0,255,242,0.25);color:rgba(0,255,242,0.5);font-family:'Orbitron',sans-serif;font-size:0.55rem;font-weight:700;letter-spacing:3px;padding:7px 0;cursor:pointer;" data-i18n="settings.close">CERRAR</button>
  </div>
  <script src="auth-check.js"></script>
  <script src="shared/bg-animation.js"></script>
  <script src="shared/audio.js"></script>
  <script src="menu.js"></script>
  <script>
    // Show user bar once auth is confirmed
    const _checkUser = setInterval(() => {
      if (window.currentUser) {
        clearInterval(_checkUser);
        document.getElementById('user-display').textContent = window.currentUser.displayName;
        document.getElementById('user-bar').style.display = '';
        document.getElementById('logout-btn').addEventListener('click', async () => {
          if (typeof playSelectSound === 'function') playSelectSound();
          await fetch('/auth/logout', { method: 'POST' });
          setTimeout(() => { window.location.href = '/login.html'; }, 300);
        });
        // Load currencies
        fetch('/api/gamedata').then(r => r.ok ? r.json() : null).then(data => {
          if (!data) return;
          document.getElementById('menu-gems').textContent = data.gems || 0;
          document.getElementById('menu-silver').textContent = data.silverCoins || 0;
          document.getElementById('menu-currencies').style.display = '';
        }).catch(() => {});
      }
    }, 100);

    // Menu settings panel
    (function() {
      const btn = document.getElementById('menu-settings-btn');
      const panel = document.getElementById('menu-settings-panel');
      const mt = document.getElementById('menu-music-toggle');
      const st = document.getElementById('menu-sfx-toggle');
      const cl = document.getElementById('menu-settings-close');
      const lt = document.getElementById('menu-lang-toggle');

      const tp = document.getElementById('menu-track-prev');
      const tn = document.getElementById('menu-track-next');
      const tname = document.getElementById('menu-track-name');

      function syncLangBtn() {
        lt.textContent = getLanguage().toUpperCase();
      }

      function sync() {
        const mOn = typeof musicEnabled !== 'undefined' ? musicEnabled : true;
        const sOn = typeof sfxEnabled !== 'undefined' ? sfxEnabled : true;
        mt.textContent = mOn ? 'ON' : 'OFF';
        mt.style.color = mOn ? '#00fff2' : '#ff6644';
        mt.style.borderColor = mOn ? 'rgba(0,255,242,0.4)' : 'rgba(255,102,68,0.4)';
        st.textContent = sOn ? 'ON' : 'OFF';
        st.style.color = sOn ? '#00fff2' : '#ff6644';
        st.style.borderColor = sOn ? 'rgba(0,255,242,0.4)' : 'rgba(255,102,68,0.4)';
        if (tname && typeof getTrackName === 'function') tname.textContent = getTrackName();
        syncLangBtn();
      }

      btn.addEventListener('click', () => {
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        sync();
      });
      mt.addEventListener('click', () => { if (typeof toggleMusic === 'function') toggleMusic(); sync(); });
      st.addEventListener('click', () => { if (typeof toggleSFX === 'function') toggleSFX(); sync(); });
      if (tp) tp.addEventListener('click', () => { if (typeof prevTrack === 'function') prevTrack(); if (typeof playSelectSound === 'function') playSelectSound(); sync(); });
      if (tn) tn.addEventListener('click', () => { if (typeof nextTrack === 'function') nextTrack(); if (typeof playSelectSound === 'function') playSelectSound(); sync(); });
      cl.addEventListener('click', () => { panel.style.display = 'none'; });
      lt.addEventListener('click', () => { toggleLanguage(); location.reload(); });

      syncLangBtn();
    })();

    // Apply i18n to all data-i18n elements
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
        el.placeholder = t(key);
      } else {
        el.textContent = t(key);
      }
    });
  </script>
</body>
</html>
