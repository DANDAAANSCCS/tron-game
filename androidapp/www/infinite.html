<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/app-config.js"></script>
  <script src="shared/offline.js"></script>
  <script src="shared/i18n.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DEFENSE — INFINITE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Infinite mode page ── */
    .infinite-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
    }

    .infinite-header {
      flex-shrink: 0;
      padding: 40px 20px 12px;
    }

    .infinite-footer {
      flex-shrink: 0;
      padding: 12px 20px 20px;
      display: flex;
      justify-content: center;
    }

    .infinite-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px 12px;
      gap: 24px;
    }

    /* Info card */
    .infinite-card {
      width: 480px;
      max-width: 100%;
      background: rgba(5, 5, 15, 0.85);
      border: 1px solid rgba(0, 255, 242, 0.15);
      padding: 24px 28px;
      position: relative;
      overflow: hidden;
    }

    .infinite-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(0, 255, 242, 0.04), transparent 60%);
      pointer-events: none;
    }

    /* Corner accent */
    .infinite-card::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 20px; height: 20px;
      border-top: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
      opacity: 0.3;
    }

    .infinite-desc {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    /* Best score display */
    .infinite-record {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 10px 16px;
      border: 1px solid rgba(0, 255, 242, 0.12);
      background: rgba(0, 255, 242, 0.03);
    }

    .infinite-record-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: rgba(0, 255, 242, 0.45);
      margin-right: 10px;
    }

    .infinite-record-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan);
    }

    .infinite-no-record {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 4px;
      color: rgba(0, 255, 242, 0.25);
      font-style: normal;
    }

    /* START button */
    .infinite-start-btn {
      width: 480px;
      max-width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(0, 255, 242, 0.07);
      border: 1px solid rgba(0, 255, 242, 0.45);
      color: var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 8px;
      cursor: pointer;
      text-shadow:
        0 0 10px var(--cyan),
        0 0 20px rgba(0, 255, 242, 0.5);
      box-shadow:
        0 0 20px rgba(0, 255, 242, 0.12),
        inset 0 0 20px rgba(0, 255, 242, 0.04);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }

    .infinite-start-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 242, 0.08), transparent);
      transition: left 0.5s ease;
    }

    .infinite-start-btn:hover {
      background: rgba(0, 255, 242, 0.13);
      border-color: rgba(0, 255, 242, 0.75);
      box-shadow:
        0 0 35px rgba(0, 255, 242, 0.25),
        inset 0 0 25px rgba(0, 255, 242, 0.07);
      text-shadow:
        0 0 14px var(--cyan),
        0 0 30px rgba(0, 255, 242, 0.7);
    }

    .infinite-start-btn:hover::before {
      left: 100%;
    }

    .infinite-start-btn:active {
      background: rgba(0, 255, 242, 0.22);
    }

    .infinite-start-btn.flash {
      animation: clickFlash 0.4s ease;
    }

    @media (max-width: 600px) {
      .infinite-card,
      .infinite-start-btn {
        width: 100%;
        max-width: 360px;
      }

      .infinite-desc {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="scanlines"></div>

  <div class="infinite-container">

    <div class="infinite-header">
      <h1 class="levels-title">
        <span class="logo-bracket">[</span>
        <span data-i18n="infinite.title">MODO INFINITO</span>
        <span class="logo-bracket">]</span>
      </h1>
      <div class="levels-subtitle" data-i18n="infinite.subtitle">SOBREVIVE TODO LO QUE PUEDAS</div>
    </div>

    <div class="infinite-content">

      <div class="infinite-card">
        <p class="infinite-desc">
          Oleadas infinitas sin limite. Los enemigos se vuelven mas fuertes. &iquest;Cuanto tiempo sobreviviras?
        </p>

        <!-- Best score record -->
        <div class="infinite-record" id="record-row">
          <span class="infinite-record-label" data-i18n="infinite.best">MEJOR</span>
          <span class="infinite-record-value" id="record-value">
            <span class="infinite-no-record" data-i18n="infinite.no_record">SIN RECORD</span>
          </span>
        </div>
      </div>

      <button class="infinite-start-btn" id="start-btn">
        <span data-i18n="infinite.start">INICIAR</span>
      </button>

    </div>

    <div class="infinite-footer">
      <a href="/menu.html" class="back-btn" id="back-btn">
        <span class="menu-arrow">&lt;</span>
        <span class="menu-text" data-i18n="levels.back">VOLVER</span>
      </a>
    </div>

  </div>

  <script src="auth-check.js"></script>
  <script src="shared/bg-animation.js"></script>
  <script src="shared/audio.js"></script>
  <script src="infinite.js"></script>
  <script>
    // Apply i18n to all data-i18n elements
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
        el.placeholder = t(key);
      } else {
        el.textContent = t(key);
      }
    });
  </script>
</body>
</html>
