<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/app-config.js"></script>
  <script src="shared/offline.js"></script>
  <script src="shared/i18n.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DEFENSE — HABILIDADES</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Card collection overrides ── */
    .abilities-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .abilities-header {
      flex-shrink: 0;
      padding: 40px 20px 12px;
      position: relative;
      z-index: 2;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .gems-display {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #e040fb;
    }

    .shop-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 8px 18px;
      color: #ffaa00;
      border: 1px solid rgba(255, 170, 0, 0.45);
      background: rgba(255, 170, 0, 0.07);
      text-decoration: none;
      text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.08);
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .shop-btn:hover {
      background: rgba(255, 170, 0, 0.14);
      border-color: rgba(255, 170, 0, 0.7);
      box-shadow: 0 0 18px rgba(255, 170, 0, 0.2);
      text-shadow: 0 0 14px rgba(255, 170, 0, 0.7);
    }

    /* ── Card layout ── */
    .abilities-grid {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .abilities-grid::-webkit-scrollbar {
      width: 3px;
    }

    .abilities-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .abilities-grid::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 242, 0.2);
      border-radius: 2px;
    }

    .ability-card {
      display: flex;
      align-items: stretch;
      gap: 0;
      padding: 0;
      width: 100%;
      max-width: 620px;
      min-height: 60px;
      background: rgba(5, 5, 15, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
      position: relative;
      text-align: left;
      overflow: hidden;
    }

    .ability-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: transparent;
      transition: background 0.3s ease;
    }

    .ability-card.has-cards::before {
      background: var(--rarity-color, var(--cyan));
      box-shadow: 0 0 8px var(--rarity-color, var(--cyan));
    }

    .ability-card.equipped {
      background: rgba(0, 255, 102, 0.03);
    }

    .ability-card.equipped::before {
      background: #00ff66;
      box-shadow: 0 0 10px #00ff66;
    }

    .ability-card:hover {
      transform: translateX(3px);
      border-color: rgba(0, 255, 242, 0.2);
    }

    .ability-card.deny {
      animation: upgDeny 0.3s ease;
    }

    /* ── Icon column ── */
    .ab-icon-col {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      flex-shrink: 0;
      padding: 16px 0;
      font-size: 2rem;
      transition: color 0.3s;
    }

    /* ── Body ── */
    .ab-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 14px 14px 14px 10px;
      min-width: 0;
    }

    .ab-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ab-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 3px;
      transition: color 0.3s;
    }

    .ab-rarity {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 3px;
      padding: 2px 7px;
      border: 1px solid;
      flex-shrink: 0;
    }

    .ab-equipped-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.48rem;
      letter-spacing: 2px;
      color: #00ff66;
      padding: 1px 6px;
      border: 1px solid rgba(0, 255, 102, 0.35);
      background: rgba(0, 255, 102, 0.08);
      flex-shrink: 0;
    }

    .ab-desc {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.38);
      line-height: 1.4;
    }

    .ab-stats {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 2px;
      color: rgba(0, 255, 242, 0.48);
    }

    /* ── Level & progress ── */
    .ab-level-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .ab-lvl-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 2px;
      flex-shrink: 0;
    }

    .ab-lvl-badge.no-cards {
      color: rgba(255, 255, 255, 0.2);
    }

    .ab-lvl-badge.max-level {
      color: #ffaa00;
      text-shadow: 0 0 8px rgba(255, 170, 0, 0.6);
    }

    .ab-progress-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ab-progress-bar-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .ab-progress-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .ab-progress-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.3);
    }

    .ab-no-cards-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.18);
      margin-top: 4px;
    }

    /* ── Silver display ── */
    .silver-display {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 2px;
    }

    /* ── Upgrade button ── */
    .ab-upgrade-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 6px 12px;
      border: 1px solid rgba(192, 192, 192, 0.2);
      background: rgba(192, 192, 192, 0.04);
      color: rgba(192, 192, 192, 0.4);
      cursor: not-allowed;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
    }

    .ab-upgrade-btn.can-upgrade {
      border-color: rgba(0, 255, 102, 0.4);
      background: rgba(0, 255, 102, 0.06);
      color: #00ff66;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.08);
    }

    .ab-upgrade-btn.can-upgrade:active {
      background: rgba(0, 255, 102, 0.15);
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.2);
    }

    .ab-upgrade-cost {
      font-size: 0.55rem;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .ab-upgrade-hint {
      font-size: 0.4rem;
      font-family: 'Share Tech Mono', monospace;
      color: rgba(255, 100, 68, 0.6);
      letter-spacing: 1px;
    }

    /* ── Action column ── */
    .ab-action-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 12px 10px 0;
      flex-shrink: 0;
      gap: 4px;
    }

    .ab-equip-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 9px 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid;
      background: transparent;
      white-space: nowrap;
    }

    .ab-equip-btn.ab-equip {
      color: #00fff2;
      border-color: rgba(0, 255, 242, 0.35);
      background: rgba(0, 255, 242, 0.06);
      text-shadow: 0 0 8px rgba(0, 255, 242, 0.4);
      box-shadow: 0 0 8px rgba(0, 255, 242, 0.08);
    }

    .ab-equip-btn.ab-equip:hover,
    .ab-equip-btn.ab-equip:active {
      background: rgba(0, 255, 242, 0.13);
      border-color: rgba(0, 255, 242, 0.6);
      box-shadow: 0 0 16px rgba(0, 255, 242, 0.2);
      text-shadow: 0 0 12px rgba(0, 255, 242, 0.6);
    }

    .ab-equip-btn.ab-equip.no-slots {
      color: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
      box-shadow: none;
      text-shadow: none;
    }

    .ab-equip-btn.ab-unequip {
      color: #ff6644;
      border-color: rgba(255, 102, 68, 0.35);
      background: rgba(255, 68, 34, 0.06);
      text-shadow: 0 0 8px rgba(255, 102, 68, 0.4);
      box-shadow: 0 0 8px rgba(255, 68, 34, 0.08);
    }

    .ab-equip-btn.ab-unequip:hover,
    .ab-equip-btn.ab-unequip:active {
      background: rgba(255, 68, 34, 0.13);
      border-color: rgba(255, 102, 68, 0.6);
      box-shadow: 0 0 16px rgba(255, 68, 34, 0.2);
      text-shadow: 0 0 12px rgba(255, 102, 68, 0.6);
    }

    /* ── Bottom nav ── */
    .abilities-footer {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding: 12px 20px 20px;
      position: relative;
      z-index: 2;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .abilities-header {
        padding: 16px 12px 10px;
      }

      .abilities-grid {
        padding: 0 12px 10px;
      }

      .abilities-footer {
        padding: 10px 12px 16px;
      }

      .ability-card {
        max-width: 100%;
      }

      .ab-icon-col {
        width: 50px;
        font-size: 1.6rem;
      }

      .ab-equip-btn {
        font-size: 0.5rem;
        padding: 8px 10px;
        letter-spacing: 1px;
      }

      .ab-name {
        font-size: 0.75rem;
        letter-spacing: 2px;
      }
    }

    @media (max-width: 380px) {
      .abilities-header {
        padding: 12px 10px 8px;
      }

      .abilities-grid {
        padding: 0 10px 10px;
        gap: 8px;
      }

      .header-top-row {
        gap: 8px;
      }

      .header-meta {
        gap: 10px;
      }

      .ab-icon-col {
        width: 42px;
        font-size: 1.4rem;
        padding: 12px 0;
      }

      .ab-body {
        padding: 10px 10px 10px 8px;
      }

      .ab-name {
        font-size: 0.68rem;
        letter-spacing: 1px;
      }

      .ab-desc {
        font-size: 0.55rem;
      }

      .ab-equip-btn {
        font-size: 0.45rem;
        padding: 7px 8px;
        letter-spacing: 0;
        min-height: 44px;
      }

      .ab-action-col {
        padding: 8px 8px 8px 0;
      }

      .ab-upgrade-btn {
        padding: 5px 8px;
        font-size: 0.45rem;
      }

      .shop-btn {
        font-size: 0.5rem;
        padding: 6px 12px;
        letter-spacing: 2px;
      }

      .silver-display {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="scanlines"></div>

  <div class="abilities-container">
    <div class="abilities-header">
      <div class="header-top-row">
        <div>
          <h1 class="levels-title" data-i18n="abilities.title">HABILIDADES</h1>
          <div class="levels-subtitle" data-i18n="abilities.subtitle">CARD COLLECTION MODULE</div>
        </div>
        <div class="header-meta">
          <div class="gems-display">
            <canvas id="gem-icon" width="18" height="18"></canvas>
            <span id="gems-count">0</span>
          </div>
          <div class="silver-display">
            <span style="color:#c0c0c0;font-size:0.85rem;">&#9673;</span>
            <span id="silver-count" style="color:#c0c0c0;">0</span>
          </div>
          <a href="/shop.html" class="shop-btn" data-i18n="abilities.go_shop">IR A TIENDA</a>
        </div>
      </div>
      <div class="equip-info"><span data-i18n="abilities.equipped">EQUIPADAS</span>: <span id="equip-counter">0 / 5</span></div>
    </div>

    <div class="abilities-grid" id="abilities-grid"></div>

    <div class="abilities-footer">
      <a href="/menu.html" class="back-btn">
        <span class="menu-arrow">&lt;</span>
        <span data-i18n="abilities.back">RETURN TO GRID</span>
      </a>
    </div>
  </div>

  <script src="auth-check.js"></script>
  <script src="shared/bg-animation.js"></script>
  <script src="shared/audio.js"></script>
  <script src="abilities.js"></script>
  <script>
    // Apply i18n to all data-i18n elements
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
        el.placeholder = t(key);
      } else {
        el.textContent = t(key);
      }
    });
  </script>
</body>
</html>
