<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/app-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DEFENSE — TIENDA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ══════════════════════════════════════ */
    /*  SHOP PAGE                            */
    /* ══════════════════════════════════════ */

    .shop-container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 30px 20px;
      max-height: 100vh;
      overflow-y: auto;
      width: 100%;
    }

    .shop-header {
      margin-bottom: 32px;
    }

    .shop-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 12px;
      color: var(--cyan);
      text-shadow:
        0 0 10px var(--cyan),
        0 0 30px var(--cyan),
        0 0 60px rgba(0, 255, 242, 0.4);
      user-select: none;
    }

    .shop-subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 8px;
      color: rgba(0, 255, 242, 0.4);
      margin-top: 8px;
    }

    /* Gems display reused from upgrades page */
    .shop-gems {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 18px;
      border: 1px solid rgba(224, 64, 251, 0.3);
      background: rgba(224, 64, 251, 0.05);
    }

    #shop-gems-count {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      color: #e040fb;
      text-shadow: 0 0 10px #e040fb;
    }

    /* ── Chest Grid ── */
    .chest-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      margin-bottom: 32px;
    }

    /* ── Chest Card base ── */
    .chest-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: rgba(5, 5, 15, 0.9);
      border: 1px solid;
      padding: 22px 20px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    /* Top-left corner accent */
    .chest-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 22px; height: 22px;
      border-top: 2px solid;
      border-left: 2px solid;
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }

    /* Bottom-right corner accent */
    .chest-card::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 22px; height: 22px;
      border-bottom: 2px solid;
      border-right: 2px solid;
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }

    .chest-card:hover {
      transform: translateY(-3px);
    }

    .chest-card:hover::before,
    .chest-card:hover::after {
      opacity: 1;
    }

    /* Shake animation for insufficient gems */
    .chest-card.deny {
      animation: chestDeny 0.35s ease;
    }

    @keyframes chestDeny {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-5px); }
      80%       { transform: translateX(5px); }
    }

    /* Open flash */
    .chest-card.opening {
      animation: chestOpen 0.5s ease;
    }

    @keyframes chestOpen {
      0%   { background: rgba(5, 5, 15, 0.9); }
      40%  { background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 40px currentColor; }
      100% { background: rgba(5, 5, 15, 0.9); }
    }

    /* ── Color variants ── */

    /* COMUN — cyan/teal */
    .chest-card.common {
      border-color: rgba(0, 255, 242, 0.25);
      box-shadow: 0 0 12px rgba(0, 255, 242, 0.06), inset 0 0 30px rgba(0, 255, 242, 0.02);
    }
    .chest-card.common::before,
    .chest-card.common::after {
      border-color: var(--cyan);
    }
    .chest-card.common:hover {
      border-color: rgba(0, 255, 242, 0.55);
      box-shadow: 0 0 22px rgba(0, 255, 242, 0.14), inset 0 0 30px rgba(0, 255, 242, 0.04);
    }

    /* RARO — blue/purple */
    .chest-card.rare {
      border-color: rgba(68, 136, 255, 0.25);
      box-shadow: 0 0 12px rgba(68, 136, 255, 0.07), inset 0 0 30px rgba(68, 136, 255, 0.02);
    }
    .chest-card.rare::before,
    .chest-card.rare::after {
      border-color: #4488ff;
    }
    .chest-card.rare:hover {
      border-color: rgba(68, 136, 255, 0.55);
      box-shadow: 0 0 22px rgba(68, 136, 255, 0.16), inset 0 0 30px rgba(68, 136, 255, 0.04);
    }

    /* EPICO — gold/orange */
    .chest-card.epic {
      border-color: rgba(255, 170, 0, 0.25);
      box-shadow: 0 0 12px rgba(255, 170, 0, 0.07), inset 0 0 30px rgba(255, 170, 0, 0.02);
    }
    .chest-card.epic::before,
    .chest-card.epic::after {
      border-color: #ffaa00;
    }
    .chest-card.epic:hover {
      border-color: rgba(255, 170, 0, 0.55);
      box-shadow: 0 0 22px rgba(255, 170, 0, 0.16), inset 0 0 30px rgba(255, 170, 0, 0.04);
    }

    /* ── Chest icon (CSS-drawn box) ── */
    .chest-icon-wrap {
      position: relative;
      width: 80px;
      height: 68px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .chest-icon-body {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 80px;
      height: 44px;
      border: 2px solid;
      background: rgba(0, 0, 0, 0.5);
    }

    .chest-icon-lid {
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: 28px;
      border: 2px solid;
      border-radius: 4px 4px 0 0;
      background: rgba(0, 0, 0, 0.5);
    }

    /* Horizontal band on lid */
    .chest-icon-lid::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: -2px;
      right: -2px;
      height: 8px;
      border: 2px solid;
      border-color: inherit;
      background: rgba(0, 0, 0, 0.4);
    }

    /* Lock hasp */
    .chest-icon-lock {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 14px;
      border: 2px solid;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.7);
    }

    .chest-icon-lock::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 2px;
      width: 8px;
      height: 8px;
      border: 2px solid;
      border-color: inherit;
      border-radius: 50% 50% 0 0;
    }

    /* Color the icon parts */
    .chest-card.common .chest-icon-body,
    .chest-card.common .chest-icon-lid,
    .chest-card.common .chest-icon-lock {
      border-color: var(--cyan);
      box-shadow: 0 0 8px rgba(0, 255, 242, 0.4);
    }
    .chest-card.common .chest-icon-lid::after { border-color: var(--cyan); }

    .chest-card.rare .chest-icon-body,
    .chest-card.rare .chest-icon-lid,
    .chest-card.rare .chest-icon-lock {
      border-color: #4488ff;
      box-shadow: 0 0 8px rgba(68, 136, 255, 0.4);
    }
    .chest-card.rare .chest-icon-lid::after { border-color: #4488ff; }

    .chest-card.epic .chest-icon-body,
    .chest-card.epic .chest-icon-lid,
    .chest-card.epic .chest-icon-lock {
      border-color: #ffaa00;
      box-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
    }
    .chest-card.epic .chest-icon-lid::after { border-color: #ffaa00; }

    /* ── Text elements ── */
    .chest-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .chest-card.common  .chest-name { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
    .chest-card.rare    .chest-name { color: #4488ff; text-shadow: 0 0 10px #4488ff; }
    .chest-card.epic    .chest-name { color: #ffaa00; text-shadow: 0 0 10px #ffaa00; }

    .chest-desc {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
    }

    .chest-range {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 2px;
    }

    .chest-card.common  .chest-range { color: rgba(0, 255, 242, 0.6); }
    .chest-card.rare    .chest-range { color: rgba(68, 136, 255, 0.6); }
    .chest-card.epic    .chest-range { color: rgba(255, 170, 0, 0.6); }

    /* Divider line */
    .chest-divider {
      width: 100%;
      height: 1px;
      margin: 2px 0;
    }

    .chest-card.common .chest-divider { background: linear-gradient(90deg, transparent, rgba(0, 255, 242, 0.3), transparent); }
    .chest-card.rare   .chest-divider { background: linear-gradient(90deg, transparent, rgba(68, 136, 255, 0.3), transparent); }
    .chest-card.epic   .chest-divider { background: linear-gradient(90deg, transparent, rgba(255, 170, 0, 0.3), transparent); }

    /* ── Cost & Button row ── */
    .chest-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }

    .chest-cost {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chest-cost-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      color: #e040fb;
      text-shadow: 0 0 10px rgba(224, 64, 251, 0.6);
    }

    .chest-cost-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: rgba(224, 64, 251, 0.55);
      margin-top: 2px;
    }

    /* ABRIR button */
    .chest-open-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 4px;
      padding: 12px 28px;
      min-height: 44px;
      border: 1px solid;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .chest-open-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      transition: left 0.4s ease;
    }

    .chest-open-btn:hover::before {
      left: 100%;
    }

    .chest-card.common .chest-open-btn {
      color: var(--cyan);
      border-color: rgba(0, 255, 242, 0.4);
      text-shadow: 0 0 8px var(--cyan);
    }
    .chest-card.common .chest-open-btn:hover {
      background: rgba(0, 255, 242, 0.08);
      border-color: rgba(0, 255, 242, 0.7);
      box-shadow: 0 0 18px rgba(0, 255, 242, 0.18);
    }

    .chest-card.rare .chest-open-btn {
      color: #4488ff;
      border-color: rgba(68, 136, 255, 0.4);
      text-shadow: 0 0 8px #4488ff;
    }
    .chest-card.rare .chest-open-btn:hover {
      background: rgba(68, 136, 255, 0.08);
      border-color: rgba(68, 136, 255, 0.7);
      box-shadow: 0 0 18px rgba(68, 136, 255, 0.18);
    }

    .chest-card.epic .chest-open-btn {
      color: #ffaa00;
      border-color: rgba(255, 170, 0, 0.4);
      text-shadow: 0 0 8px #ffaa00;
    }
    .chest-card.epic .chest-open-btn:hover {
      background: rgba(255, 170, 0, 0.08);
      border-color: rgba(255, 170, 0, 0.7);
      box-shadow: 0 0 18px rgba(255, 170, 0, 0.18);
    }

    .chest-open-btn:active {
      transform: scale(0.97);
    }

    /* Error message under button */
    .chest-error {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: #ff0055;
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
      min-height: 14px;
      transition: opacity 0.3s ease;
    }

    /* ══════════════════════════════════════ */
    /*  CARD REVEAL OVERLAY                  */
    /* ══════════════════════════════════════ */

    #reveal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(4px);
      animation: overlayIn 0.3s ease;
    }

    #reveal-overlay.visible {
      display: flex;
    }

    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .reveal-panel {
      position: relative;
      width: 90%;
      max-width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(5, 5, 18, 0.97);
      border: 1px solid rgba(0, 255, 242, 0.2);
      padding: 30px 24px 24px;
      text-align: center;
      animation: panelIn 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    @keyframes panelIn {
      from { transform: scale(0.88) translateY(20px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Corner accents on panel */
    .reveal-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 20px; height: 20px;
      border-top: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
    }

    .reveal-panel::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 20px; height: 20px;
      border-bottom: 2px solid var(--cyan);
      border-right: 2px solid var(--cyan);
    }

    .reveal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--cyan);
      text-shadow: 0 0 14px var(--cyan), 0 0 30px rgba(0, 255, 242, 0.3);
      margin-bottom: 4px;
    }

    .reveal-total {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 4px;
      color: rgba(0, 255, 242, 0.45);
      margin-bottom: 20px;
    }

    .reveal-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 242, 0.3), transparent);
      margin-bottom: 18px;
    }

    .reveal-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
      text-align: left;
    }

    .reveal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid;
      background: rgba(0, 0, 0, 0.3);
      animation: itemIn 0.3s ease both;
    }

    @keyframes itemIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .reveal-item-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .reveal-item-rarity {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 3px;
      opacity: 0.65;
    }

    .reveal-item-count {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 900;
    }

    /* CONTINUAR button */
    .reveal-continue-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 5px;
      padding: 12px 36px;
      min-height: 44px;
      color: var(--cyan);
      border: 1px solid rgba(0, 255, 242, 0.4);
      background: rgba(0, 255, 242, 0.04);
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 8px var(--cyan);
      width: 100%;
    }

    .reveal-continue-btn:hover {
      background: rgba(0, 255, 242, 0.1);
      border-color: rgba(0, 255, 242, 0.7);
      box-shadow: 0 0 18px rgba(0, 255, 242, 0.15);
    }

    /* Scrollbar for shop container */
    .shop-container::-webkit-scrollbar {
      width: 3px;
    }
    .shop-container::-webkit-scrollbar-track {
      background: rgba(0, 255, 242, 0.02);
    }
    .shop-container::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 242, 0.2);
    }

    .reveal-panel::-webkit-scrollbar {
      width: 3px;
    }
    .reveal-panel::-webkit-scrollbar-track {
      background: rgba(0, 255, 242, 0.02);
    }
    .reveal-panel::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 242, 0.2);
    }

    /* Gem canvas in shop header */
    #shop-gem-icon {
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="scanlines"></div>

  <!-- Card Reveal Overlay -->
  <div id="reveal-overlay" role="dialog" aria-modal="true" aria-labelledby="reveal-title">
    <div class="reveal-panel">
      <div class="reveal-title" id="reveal-title">COFRE ABIERTO</div>
      <div class="reveal-total" id="reveal-total"></div>
      <div class="reveal-divider"></div>
      <div class="reveal-list" id="reveal-list"></div>
      <button class="reveal-continue-btn" id="reveal-continue-btn" aria-label="Continuar">
        CONTINUAR
      </button>
    </div>
  </div>

  <div class="shop-container">
    <div class="shop-header">
      <h1 class="shop-title">
        <span class="logo-bracket">[</span>
        TIENDA
        <span class="logo-bracket">]</span>
      </h1>
      <div class="shop-subtitle">CARD SHOP MODULE</div>
      <div class="shop-gems" id="shop-gems-display" aria-label="Gemas disponibles">
        <canvas id="shop-gem-icon" width="18" height="18" aria-hidden="true"></canvas>
        <span id="shop-gems-count">0</span>
      </div>
    </div>

    <div class="chest-grid" role="list">

      <!-- COFRE COMUN -->
      <div class="chest-card common" role="listitem" data-chest="common" data-cost="150">
        <div class="chest-icon-wrap" aria-hidden="true">
          <div class="chest-icon-lid"></div>
          <div class="chest-icon-body">
            <div class="chest-icon-lock"></div>
          </div>
        </div>
        <div class="chest-name">COFRE COMUN</div>
        <div class="chest-desc">Cartas comunes y raras</div>
        <div class="chest-range">25 &ndash; 90 cartas</div>
        <div class="chest-divider"></div>
        <div class="chest-footer">
          <div class="chest-cost">
            <div>
              <div class="chest-cost-val">150</div>
              <div class="chest-cost-label">GEMAS</div>
            </div>
          </div>
          <button
            class="chest-open-btn"
            data-chest="common"
            aria-label="Abrir Cofre Comun por 150 gemas"
          >ABRIR</button>
        </div>
        <div class="chest-error" aria-live="polite"></div>
      </div>

      <!-- COFRE RARO -->
      <div class="chest-card rare" role="listitem" data-chest="rare" data-cost="350">
        <div class="chest-icon-wrap" aria-hidden="true">
          <div class="chest-icon-lid"></div>
          <div class="chest-icon-body">
            <div class="chest-icon-lock"></div>
          </div>
        </div>
        <div class="chest-name">COFRE RARO</div>
        <div class="chest-desc">Cartas raras y épicas</div>
        <div class="chest-range">10 &ndash; 30 cartas</div>
        <div class="chest-divider"></div>
        <div class="chest-footer">
          <div class="chest-cost">
            <div>
              <div class="chest-cost-val">350</div>
              <div class="chest-cost-label">GEMAS</div>
            </div>
          </div>
          <button
            class="chest-open-btn"
            data-chest="rare"
            aria-label="Abrir Cofre Raro por 350 gemas"
          >ABRIR</button>
        </div>
        <div class="chest-error" aria-live="polite"></div>
      </div>

      <!-- COFRE EPICO -->
      <div class="chest-card epic" role="listitem" data-chest="epic" data-cost="500">
        <div class="chest-icon-wrap" aria-hidden="true">
          <div class="chest-icon-lid"></div>
          <div class="chest-icon-body">
            <div class="chest-icon-lock"></div>
          </div>
        </div>
        <div class="chest-name">COFRE EPICO</div>
        <div class="chest-desc">Cartas épicas y legendarias</div>
        <div class="chest-range">4 &ndash; 8 cartas</div>
        <div class="chest-divider"></div>
        <div class="chest-footer">
          <div class="chest-cost">
            <div>
              <div class="chest-cost-val">500</div>
              <div class="chest-cost-label">GEMAS</div>
            </div>
          </div>
          <button
            class="chest-open-btn"
            data-chest="epic"
            aria-label="Abrir Cofre Epico por 500 gemas"
          >ABRIR</button>
        </div>
        <div class="chest-error" aria-live="polite"></div>
      </div>

    </div><!-- /chest-grid -->

    <button class="back-btn" id="shop-back-btn" aria-label="Volver al menu principal">
      <span class="menu-arrow" aria-hidden="true">&lt;</span>
      <span class="menu-text">VOLVER</span>
    </button>
  </div>

  <script src="auth-check.js"></script>
  <script src="shared/bg-animation.js"></script>
  <script src="shared/audio.js"></script>
  <script src="shop.js"></script>
</body>
</html>
