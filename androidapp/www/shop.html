<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/app-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DEFENSE — TIENDA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ══════════════════════════════════════ */
    /*  SHOP PAGE — REWRITE                  */
    /* ══════════════════════════════════════ */

    .shop-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header (fixed at top) ── */
    .shop-header {
      flex-shrink: 0;
      padding: 30px 16px 12px;
      padding-top: max(30px, env(safe-area-inset-top, 30px));
      width: 100%;
    }

    .shop-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 12px;
      color: var(--cyan);
      text-shadow:
        0 0 10px var(--cyan),
        0 0 30px var(--cyan),
        0 0 60px rgba(0, 255, 242, 0.4);
      user-select: none;
    }

    .shop-subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 8px;
      color: rgba(0, 255, 242, 0.4);
      margin-top: 6px;
    }

    .shop-gems {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 6px 18px;
      border: 1px solid rgba(224, 64, 251, 0.3);
      background: rgba(224, 64, 251, 0.05);
    }

    #shop-gems-count {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      color: #e040fb;
      text-shadow: 0 0 10px #e040fb;
    }

    /* ── Chest Grid (scrollable) ── */
    .chest-grid {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      width: 100%;
      padding: 0 16px 12px;
    }

    .chest-grid::-webkit-scrollbar { width: 3px; }
    .chest-grid::-webkit-scrollbar-track { background: transparent; }
    .chest-grid::-webkit-scrollbar-thumb { background: rgba(0, 255, 242, 0.2); border-radius: 2px; }

    /* ── Footer (fixed at bottom) ── */
    .shop-footer {
      flex-shrink: 0;
      padding: 12px 16px 20px;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* ── Chest Card ── */
    .chest-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(5, 5, 18, 0.92);
      border: 1px solid;
      padding: 24px 20px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      transition: box-shadow 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
      /* For chest-zoom-to-center animation origin */
      transform-origin: center center;
    }

    /* Corner brackets */
    .chest-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 20px; height: 20px;
      border-top: 2px solid;
      border-left: 2px solid;
      opacity: 0.5;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .chest-card::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 20px; height: 20px;
      border-bottom: 2px solid;
      border-right: 2px solid;
      opacity: 0.5;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .chest-card:active {
      transform: scale(0.98);
    }

    /* Floating particles around each chest card */
    .chest-particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      pointer-events: none;
      animation: particleFloat 4s ease-in-out infinite;
      opacity: 0;
    }

    @keyframes particleFloat {
      0%   { transform: translateY(0) scale(1); opacity: 0; }
      20%  { opacity: 0.8; }
      80%  { opacity: 0.5; }
      100% { transform: translateY(-60px) scale(0); opacity: 0; }
    }

    /* Deny shake */
    .chest-card.deny {
      animation: chestDeny 0.38s ease;
    }

    @keyframes chestDeny {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-10px); }
      40%      { transform: translateX(10px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }

    /* ── Color variants ── */

    /* COMUN — cyan */
    .chest-card.common {
      border-color: rgba(0, 255, 242, 0.22);
      box-shadow: 0 0 16px rgba(0, 255, 242, 0.05), inset 0 0 40px rgba(0, 255, 242, 0.02);
    }
    .chest-card.common::before,
    .chest-card.common::after { border-color: var(--cyan); }
    .chest-card.common:hover {
      border-color: rgba(0, 255, 242, 0.5);
      box-shadow: 0 0 28px rgba(0, 255, 242, 0.12), inset 0 0 40px rgba(0, 255, 242, 0.04);
      transform: translateY(-4px);
    }
    .chest-card.common:hover::before,
    .chest-card.common:hover::after { opacity: 1; }
    .chest-card.common .chest-particle { background: var(--cyan); box-shadow: 0 0 4px var(--cyan); }

    /* RARO — blue */
    .chest-card.rare {
      border-color: rgba(68, 136, 255, 0.22);
      box-shadow: 0 0 16px rgba(68, 136, 255, 0.06), inset 0 0 40px rgba(68, 136, 255, 0.02);
    }
    .chest-card.rare::before,
    .chest-card.rare::after { border-color: #4488ff; }
    .chest-card.rare:hover {
      border-color: rgba(68, 136, 255, 0.5);
      box-shadow: 0 0 28px rgba(68, 136, 255, 0.14), inset 0 0 40px rgba(68, 136, 255, 0.04);
      transform: translateY(-4px);
    }
    .chest-card.rare:hover::before,
    .chest-card.rare:hover::after { opacity: 1; }
    .chest-card.rare .chest-particle { background: #4488ff; box-shadow: 0 0 4px #4488ff; }

    /* EPICO — gold */
    .chest-card.epic {
      border-color: rgba(255, 170, 0, 0.22);
      box-shadow: 0 0 16px rgba(255, 170, 0, 0.06), inset 0 0 40px rgba(255, 170, 0, 0.02);
    }
    .chest-card.epic::before,
    .chest-card.epic::after { border-color: #ffaa00; }
    .chest-card.epic:hover {
      border-color: rgba(255, 170, 0, 0.5);
      box-shadow: 0 0 28px rgba(255, 170, 0, 0.14), inset 0 0 40px rgba(255, 170, 0, 0.04);
      transform: translateY(-4px);
    }
    .chest-card.epic:hover::before,
    .chest-card.epic:hover::after { opacity: 1; }
    .chest-card.epic .chest-particle { background: #ffaa00; box-shadow: 0 0 4px #ffaa00; }

    /* ── Chest Icon ── */
    .chest-icon-wrap {
      position: relative;
      width: 100px;
      height: 86px;
      margin-bottom: 2px;
      flex-shrink: 0;
      /* Floating bob animation */
      animation: chestBob 3s ease-in-out infinite;
    }

    @keyframes chestBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    /* Glow ring below chest (shadow on ground) */
    .chest-icon-wrap::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 6px;
      border-radius: 50%;
      filter: blur(4px);
      animation: shadowPulse 3s ease-in-out infinite;
      opacity: 0.4;
    }

    @keyframes shadowPulse {
      0%, 100% { transform: translateX(-50%) scaleX(1); opacity: 0.4; }
      50%       { transform: translateX(-50%) scaleX(0.6); opacity: 0.15; }
    }

    .chest-card.common .chest-icon-wrap::after  { background: var(--cyan); }
    .chest-card.rare   .chest-icon-wrap::after  { background: #4488ff; }
    .chest-card.epic   .chest-icon-wrap::after  { background: #ffaa00; }

    /* Body */
    .chest-icon-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 100px; height: 56px;
      border: 2px solid;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 0 0 4px 4px;
    }

    /* Lid */
    .chest-icon-lid {
      position: absolute;
      top: 0; left: 0;
      width: 100px; height: 36px;
      border: 2px solid;
      border-radius: 6px 6px 0 0;
      background: rgba(0, 0, 0, 0.55);
      transform-origin: bottom center;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    /* Lid band */
    .chest-icon-lid::after {
      content: '';
      position: absolute;
      bottom: -2px; left: -2px; right: -2px;
      height: 10px;
      border: 2px solid;
      border-color: inherit;
      background: rgba(0, 0, 0, 0.45);
    }

    /* Shimmer sweep on lid */
    .chest-icon-lid::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      animation: shimmerSweep 3s ease-in-out infinite 1.5s;
      border-radius: inherit;
    }

    @keyframes shimmerSweep {
      0%   { left: -80%; opacity: 0; }
      10%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { left: 140%; opacity: 0; }
    }

    /* Lock */
    .chest-icon-lock {
      position: absolute;
      bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 18px; height: 16px;
      border: 2px solid;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.8);
    }

    .chest-icon-lock::before {
      content: '';
      position: absolute;
      top: -9px; left: 2px;
      width: 10px; height: 9px;
      border: 2px solid;
      border-color: inherit;
      border-radius: 50% 50% 0 0;
    }

    /* Color the icon parts per rarity */
    .chest-card.common .chest-icon-body,
    .chest-card.common .chest-icon-lid,
    .chest-card.common .chest-icon-lock {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 255, 242, 0.45), inset 0 0 10px rgba(0, 255, 242, 0.08);
    }
    .chest-card.common .chest-icon-lid::after { border-color: var(--cyan); }

    .chest-card.rare .chest-icon-body,
    .chest-card.rare .chest-icon-lid,
    .chest-card.rare .chest-icon-lock {
      border-color: #4488ff;
      box-shadow: 0 0 10px rgba(68, 136, 255, 0.45), inset 0 0 10px rgba(68, 136, 255, 0.08);
    }
    .chest-card.rare .chest-icon-lid::after { border-color: #4488ff; }

    .chest-card.epic .chest-icon-body,
    .chest-card.epic .chest-icon-lid,
    .chest-card.epic .chest-icon-lock {
      border-color: #ffaa00;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.5), inset 0 0 10px rgba(255, 170, 0, 0.1);
    }
    .chest-card.epic .chest-icon-lid::after { border-color: #ffaa00; }

    /* Opened lid (JS adds .is-opening class to the chest card during animation) */
    .chest-card.is-opening .chest-icon-lid {
      transform: rotateX(-110deg);
    }

    /* Light beam from inside the chest when opening */
    .chest-light-beam {
      position: absolute;
      bottom: 56px; /* sits at body top */
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 0;
      background: linear-gradient(to top, rgba(255,255,255,0.9), transparent);
      clip-path: polygon(20% 100%, 80% 100%, 100% 0%, 0% 0%);
      opacity: 0;
      transition: none;
      pointer-events: none;
    }

    /* ── Text elements ── */
    .chest-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .chest-card.common .chest-name { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
    .chest-card.rare   .chest-name { color: #4488ff;     text-shadow: 0 0 10px #4488ff; }
    .chest-card.epic   .chest-name { color: #ffaa00;     text-shadow: 0 0 10px #ffaa00; }

    .chest-desc {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.63rem;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
    }

    .chest-range {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 2px;
    }

    .chest-card.common .chest-range { color: rgba(0, 255, 242, 0.6); }
    .chest-card.rare   .chest-range { color: rgba(68, 136, 255, 0.6); }
    .chest-card.epic   .chest-range { color: rgba(255, 170, 0, 0.6); }

    .chest-divider {
      width: 100%;
      height: 1px;
      margin: 2px 0;
    }
    .chest-card.common .chest-divider { background: linear-gradient(90deg, transparent, rgba(0, 255, 242, 0.3), transparent); }
    .chest-card.rare   .chest-divider { background: linear-gradient(90deg, transparent, rgba(68, 136, 255, 0.3), transparent); }
    .chest-card.epic   .chest-divider { background: linear-gradient(90deg, transparent, rgba(255, 170, 0, 0.3), transparent); }

    /* ── Cost & Button row ── */
    .chest-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }

    .chest-cost {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chest-gem-icon {
      font-size: 1.2rem;
      line-height: 1;
    }

    .chest-cost-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: #e040fb;
      text-shadow: 0 0 12px rgba(224, 64, 251, 0.7);
    }

    .chest-cost-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 2px;
      color: rgba(224, 64, 251, 0.5);
      margin-top: 2px;
    }

    /* ABRIR button */
    .chest-open-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 4px;
      padding: 12px 28px;
      min-height: 44px;
      min-width: 100px;
      border: 1px solid;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .chest-open-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      transition: left 0.4s ease;
    }

    .chest-open-btn:hover::before { left: 100%; }

    .chest-card.common .chest-open-btn {
      color: var(--cyan);
      border-color: rgba(0, 255, 242, 0.4);
      text-shadow: 0 0 8px var(--cyan);
    }
    .chest-card.common .chest-open-btn:hover {
      background: rgba(0, 255, 242, 0.09);
      border-color: rgba(0, 255, 242, 0.75);
      box-shadow: 0 0 20px rgba(0, 255, 242, 0.2);
    }

    .chest-card.rare .chest-open-btn {
      color: #4488ff;
      border-color: rgba(68, 136, 255, 0.4);
      text-shadow: 0 0 8px #4488ff;
    }
    .chest-card.rare .chest-open-btn:hover {
      background: rgba(68, 136, 255, 0.09);
      border-color: rgba(68, 136, 255, 0.75);
      box-shadow: 0 0 20px rgba(68, 136, 255, 0.2);
    }

    .chest-card.epic .chest-open-btn {
      color: #ffaa00;
      border-color: rgba(255, 170, 0, 0.4);
      text-shadow: 0 0 8px #ffaa00;
    }
    .chest-card.epic .chest-open-btn:hover {
      background: rgba(255, 170, 0, 0.09);
      border-color: rgba(255, 170, 0, 0.75);
      box-shadow: 0 0 20px rgba(255, 170, 0, 0.2);
    }

    .chest-open-btn:active { transform: scale(0.96); }

    .chest-open-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .chest-error {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: #ff0055;
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
      min-height: 14px;
      transition: opacity 0.3s ease;
    }

    /* ══════════════════════════════════════ */
    /*  SCREEN FLASH                         */
    /* ══════════════════════════════════════ */

    #screen-flash {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: white;
      opacity: 0;
      pointer-events: none;
    }

    /* ══════════════════════════════════════ */
    /*  CARD REVEAL OVERLAY                  */
    /* ══════════════════════════════════════ */

    #reveal-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 5, 0.92);
      backdrop-filter: blur(6px);
      padding-top: max(20px, env(safe-area-inset-top, 20px));
      padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
    }

    #reveal-overlay.visible {
      display: flex;
    }

    /* Floating background particles during reveal */
    #reveal-bg-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .reveal-bg-dot {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      animation: bgDotFloat linear infinite;
      opacity: 0;
    }

    @keyframes bgDotFloat {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* Header row */
    .reveal-header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .reveal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--cyan);
      text-shadow: 0 0 14px var(--cyan), 0 0 30px rgba(0, 255, 242, 0.3);
      animation: revealTitlePulse 2s ease-in-out infinite alternate;
    }

    @keyframes revealTitlePulse {
      from { text-shadow: 0 0 14px var(--cyan), 0 0 30px rgba(0, 255, 242, 0.3); }
      to   { text-shadow: 0 0 20px var(--cyan), 0 0 50px rgba(0, 255, 242, 0.5), 0 0 80px rgba(0, 255, 242, 0.2); }
    }

    .reveal-total {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 4px;
      color: rgba(0, 255, 242, 0.5);
      margin-top: 6px;
    }

    /* Scrollable cards area */
    .reveal-cards-viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .reveal-cards-viewport::-webkit-scrollbar { width: 3px; }
    .reveal-cards-viewport::-webkit-scrollbar-track { background: transparent; }
    .reveal-cards-viewport::-webkit-scrollbar-thumb { background: rgba(0, 255, 242, 0.2); }

    /* ── Individual card (Clash Royale inspired) ── */
    .ability-card {
      position: relative;
      border-radius: 12px;
      border: 2px solid;
      background: rgba(5, 5, 18, 0.97);
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
      /* 3D flip: start face-down */
      transform-style: preserve-3d;
      transform: rotateY(90deg) scale(0.8);
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.3, 1),
                  opacity 0.45s ease;
    }

    .ability-card.flipped-in {
      transform: rotateY(0deg) scale(1);
      opacity: 1;
    }

    /* Shine sweep across the card after flip */
    .ability-card::before {
      content: '';
      position: absolute;
      top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      border-radius: inherit;
      pointer-events: none;
    }

    .ability-card.flipped-in::before {
      animation: cardShine 0.6s ease 0.1s forwards;
    }

    @keyframes cardShine {
      from { left: -120%; }
      to   { left: 160%; }
    }

    /* Sparkle dots that appear on card reveal */
    .card-sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkleOut 0.7s ease forwards;
      opacity: 0;
    }

    @keyframes sparkleOut {
      0%   { transform: translate(0,0) scale(0); opacity: 1; }
      60%  { opacity: 1; }
      100% { transform: translate(var(--sx), var(--sy)) scale(1.5); opacity: 0; }
    }

    /* Card icon area */
    .card-icon-area {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      line-height: 1;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid;
      position: relative;
    }

    /* Pulsing glow on icon */
    .card-icon-area::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 10px;
      border: 1px solid;
      border-color: inherit;
      opacity: 0;
      animation: iconGlow 1.5s ease-in-out infinite alternate;
    }

    @keyframes iconGlow {
      from { opacity: 0; transform: scale(1); }
      to   { opacity: 0.5; transform: scale(1.06); }
    }

    /* Card text area */
    .card-info {
      flex: 1;
      text-align: left;
    }

    .card-ability-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .card-rarity-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 3px;
      opacity: 0.65;
      margin-top: 3px;
    }

    /* Count badge */
    .card-count {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      flex-shrink: 0;
      letter-spacing: 0;
    }

    /* Continue button */
    .reveal-continue-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 20px 16px 16px;
      flex-shrink: 0;
    }

    .reveal-continue-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 5px;
      padding: 14px 36px;
      min-height: 52px;
      color: var(--cyan);
      border: 1px solid rgba(0, 255, 242, 0.4);
      background: rgba(0, 255, 242, 0.04);
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 8px var(--cyan);
      width: 100%;
      display: none;
      position: relative;
      overflow: hidden;
    }

    .reveal-continue-btn.visible {
      display: block;
      animation: btnFadeIn 0.4s ease forwards;
    }

    @keyframes btnFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reveal-continue-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      transition: left 0.4s ease;
    }

    .reveal-continue-btn:hover::before { left: 100%; }

    .reveal-continue-btn:hover {
      background: rgba(0, 255, 242, 0.1);
      border-color: rgba(0, 255, 242, 0.75);
      box-shadow: 0 0 24px rgba(0, 255, 242, 0.18);
    }

    .reveal-continue-btn:active { transform: scale(0.97); }

    /* ── Scrollbars ── */
    .shop-container::-webkit-scrollbar { width: 3px; }
    .shop-container::-webkit-scrollbar-track { background: rgba(0, 255, 242, 0.02); }
    .shop-container::-webkit-scrollbar-thumb { background: rgba(0, 255, 242, 0.2); }

    /* Gem canvas in header */
    #shop-gem-icon { vertical-align: middle; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="scanlines"></div>

  <!-- Full-screen white flash for chest opening -->
  <div id="screen-flash" aria-hidden="true"></div>

  <!-- ══ Card Reveal Overlay ══ -->
  <div id="reveal-overlay" role="dialog" aria-modal="true" aria-labelledby="reveal-title-text">

    <!-- Floating background particles (populated by JS) -->
    <div id="reveal-bg-particles" aria-hidden="true"></div>

    <div class="reveal-header">
      <div class="reveal-title" id="reveal-title-text" data-i18n="shop.opened">COFRE ABIERTO</div>
      <div class="reveal-total" id="reveal-total" aria-live="polite"></div>
    </div>

    <div class="reveal-cards-viewport" id="reveal-cards-viewport" aria-label="Cartas obtenidas">
      <!-- Cards injected here by JS -->
    </div>

    <div class="reveal-continue-wrap">
      <button class="reveal-continue-btn" id="reveal-continue-btn" aria-label="Continuar al menu"
        data-i18n="shop.continue">CONTINUAR</button>
    </div>
  </div>

  <!-- ══ Main Shop ══ -->
  <div class="shop-container">

    <div class="shop-header">
      <h1 class="shop-title">
        <span class="logo-bracket">[</span><span data-i18n="shop.title">TIENDA</span><span class="logo-bracket">]</span>
      </h1>
      <div class="shop-subtitle" data-i18n="shop.subtitle">CARD SHOP MODULE</div>
      <div class="shop-gems" id="shop-gems-display" aria-label="Gemas disponibles">
        <canvas id="shop-gem-icon" width="18" height="18" aria-hidden="true"></canvas>
        <span id="shop-gems-count">0</span>
      </div>
    </div>

    <div class="chest-grid" role="list">

      <!-- COFRE COMUN -->
      <div class="chest-card common" role="listitem" data-chest="common" data-cost="150">
        <!-- Particles (injected by JS) -->
        <div class="chest-icon-wrap" aria-hidden="true">
          <div class="chest-icon-lid"></div>
          <div class="chest-icon-body">
            <div class="chest-icon-lock"></div>
          </div>
          <div class="chest-light-beam"></div>
        </div>
        <div class="chest-name" data-i18n="shop.chest_common">COFRE COMUN</div>
        <div class="chest-desc" data-i18n="shop.chest_common_desc">Cartas comunes y raras</div>
        <div class="chest-range" data-i18n="shop.cards_range" data-min="25" data-max="90">25 &ndash; 90 cartas</div>
        <div class="chest-divider"></div>
        <div class="chest-footer">
          <div class="chest-cost">
            <div class="chest-gem-icon" aria-hidden="true">💎</div>
            <div>
              <div class="chest-cost-val">150</div>
              <div class="chest-cost-label" data-i18n="shop.gems_label">GEMAS</div>
            </div>
          </div>
          <button class="chest-open-btn" data-chest="common"
            aria-label="Abrir Cofre Comun por 150 gemas" data-i18n="shop.open">ABRIR</button>
        </div>
        <div class="chest-error" aria-live="polite" aria-atomic="true"></div>
      </div>

      <!-- COFRE RARO -->
      <div class="chest-card rare" role="listitem" data-chest="rare" data-cost="350">
        <div class="chest-icon-wrap" aria-hidden="true">
          <div class="chest-icon-lid"></div>
          <div class="chest-icon-body">
            <div class="chest-icon-lock"></div>
          </div>
          <div class="chest-light-beam"></div>
        </div>
        <div class="chest-name" data-i18n="shop.chest_rare">COFRE RARO</div>
        <div class="chest-desc" data-i18n="shop.chest_rare_desc">Cartas raras y épicas</div>
        <div class="chest-range" data-i18n="shop.cards_range" data-min="10" data-max="30">10 &ndash; 30 cartas</div>
        <div class="chest-divider"></div>
        <div class="chest-footer">
          <div class="chest-cost">
            <div class="chest-gem-icon" aria-hidden="true">💎</div>
            <div>
              <div class="chest-cost-val">350</div>
              <div class="chest-cost-label" data-i18n="shop.gems_label">GEMAS</div>
            </div>
          </div>
          <button class="chest-open-btn" data-chest="rare"
            aria-label="Abrir Cofre Raro por 350 gemas" data-i18n="shop.open">ABRIR</button>
        </div>
        <div class="chest-error" aria-live="polite" aria-atomic="true"></div>
      </div>

      <!-- COFRE EPICO -->
      <div class="chest-card epic" role="listitem" data-chest="epic" data-cost="500">
        <div class="chest-icon-wrap" aria-hidden="true">
          <div class="chest-icon-lid"></div>
          <div class="chest-icon-body">
            <div class="chest-icon-lock"></div>
          </div>
          <div class="chest-light-beam"></div>
        </div>
        <div class="chest-name" data-i18n="shop.chest_epic">COFRE EPICO</div>
        <div class="chest-desc" data-i18n="shop.chest_epic_desc">Cartas épicas y legendarias</div>
        <div class="chest-range" data-i18n="shop.cards_range" data-min="4" data-max="8">4 &ndash; 8 cartas</div>
        <div class="chest-divider"></div>
        <div class="chest-footer">
          <div class="chest-cost">
            <div class="chest-gem-icon" aria-hidden="true">💎</div>
            <div>
              <div class="chest-cost-val">500</div>
              <div class="chest-cost-label" data-i18n="shop.gems_label">GEMAS</div>
            </div>
          </div>
          <button class="chest-open-btn" data-chest="epic"
            aria-label="Abrir Cofre Epico por 500 gemas" data-i18n="shop.open">ABRIR</button>
        </div>
        <div class="chest-error" aria-live="polite" aria-atomic="true"></div>
      </div>

    </div><!-- /chest-grid -->

    <div class="shop-footer">
      <button class="back-btn" id="shop-back-btn" aria-label="Volver al menu principal"
        onclick="window.location.href='menu.html'">
        <span class="menu-arrow" aria-hidden="true">&lt;</span>
        <span class="menu-text" data-i18n="shop.back">VOLVER</span>
      </button>
    </div>

  </div><!-- /shop-container -->

  <script src="auth-check.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="shared/bg-animation.js"></script>
  <script src="shared/audio.js"></script>
  <script src="shop.js"></script>
  <script>
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (key === 'shop.cards_range') {
        el.textContent = t(key, { min: el.dataset.min, max: el.dataset.max });
      } else {
        el.textContent = t(key);
      }
    });
  </script>
</body>
</html>
