<!DOCTYPE html>
<html lang="es">
<head>
  <script src="/app-config.js"></script>
  <script src="shared/offline.js"></script>
  <script src="shared/i18n.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON DEFENSE — UPGRADES</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="scanlines"></div>

  <div class="upgrades-container">
    <div class="upgrades-header">
      <h1 class="levels-title">
        <span class="logo-bracket">[</span>
        <span data-i18n="upgrades.title">UPGRADES</span>
        <span class="logo-bracket">]</span>
      </h1>
      <div class="levels-subtitle" data-i18n="upgrades.subtitle">PERMANENT ENHANCEMENTS</div>
      <div class="gems-display" id="gems-display">
        <canvas id="gem-icon-cvs" width="24" height="24"></canvas>
        <span id="gems-count">0</span>
      </div>
    </div>

    <div class="upgrades-grid" id="upgrades-grid">
      <!-- Cards injected by upgrades.js -->
    </div>

    <div class="upgrades-footer">
      <a href="/menu.html" class="back-btn">
        <span class="menu-arrow">&lt;</span>
        <span class="menu-text" data-i18n="upgrades.back">VOLVER</span>
      </a>
    </div>
  </div>

  <script src="auth-check.js"></script>
  <script src="shared/bg-animation.js"></script>
  <script src="shared/audio.js"></script>
  <script src="upgrades.js"></script>
  <script>
    // Apply i18n to all data-i18n elements
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
        el.placeholder = t(key);
      } else {
        el.textContent = t(key);
      }
    });
  </script>
</body>
</html>
